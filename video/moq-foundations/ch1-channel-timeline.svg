<svg xmlns="http://www.w3.org/2000/svg" class="d" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Four lanes across a time axis: control activity concentrates in two separated bursts, the publisher data lane starts when the subscriber session is established, both data lanes then run concurrently, and termination mirrors establishment">
  <style>
    svg.d{
      --surface:#FFFFFF; --surface-2:#F5F8F7;
      --ink:#141C1B; --ink-2:#485654; --ink-3:#6F7D7B;
      --paper:#EEF1F0; --rule:#D2DAD8;
      --accent:#0B6B63; --accent-bg:#DBEDEA;
      --track:#3B4EC0;   --track-bg:#E4E8FA;
      --group:#0F7A83;   --group-bg:#DBEFF1;
      --subgroup:#A65E00;--subgroup-bg:#F7EBD7;
      --object:#A0335E;  --object-bg:#F8E4EC;
      --warn:#A3441B;    --warn-bg:#F9E7DE;
      color:var(--ink);
    }
    @media (prefers-color-scheme: dark){
      svg.d{
        --surface:#151E1C; --surface-2:#1A2422;
        --ink:#E7EDEB; --ink-2:#A9B7B4; --ink-3:#81908D;
        --paper:#0E1413; --rule:#2B3735;
        --accent:#4FC7B8; --accent-bg:#11302C;
        --track:#93A2F7;   --track-bg:#232B52;
        --group:#54C3CE;   --group-bg:#123034;
        --subgroup:#E0A354;--subgroup-bg:#37270F;
        --object:#EE85AA;  --object-bg:#3A1A26;
        --warn:#E39067;    --warn-bg:#3A2117;
      }
    }
    .d text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px;fill:currentColor}
    .d .t-s{font-size:10.5px}
    .d .t-b{font-weight:600}
    .d .mut{fill:var(--ink-3)}
    .d .lbl{fill:var(--ink-2)}
    .d .box{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.25}
    .d .box-p{fill:var(--paper);stroke:var(--rule);stroke-width:1.25}
    .d .ln{stroke:var(--rule);stroke-width:1.25;fill:none}
    .d .ln-d{stroke:var(--rule);stroke-width:1.25;fill:none;stroke-dasharray:4 4}
    .d .flow{stroke:var(--ink-2);stroke-width:1.4;fill:none}
    .d .flow-hv{stroke:var(--ink-2);stroke-width:3;fill:none}
    .d .flow-a{stroke:var(--accent);stroke-width:1.6;fill:none}
    .d .flow-w{stroke:var(--warn);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .d .acc{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.4}
    .d .acc-t{fill:var(--accent)}
    .d .b-track{fill:var(--track-bg);stroke:var(--track);stroke-width:1.3}
    .d .b-group{fill:var(--group-bg);stroke:var(--group);stroke-width:1.3}
    .d .b-sub{fill:var(--subgroup-bg);stroke:var(--subgroup);stroke-width:1.3}
    .d .b-obj{fill:var(--object-bg);stroke:var(--object);stroke-width:1.3}
    .d .t-track{fill:var(--track)} .d .t-group{fill:var(--group)}
    .d .t-sub{fill:var(--subgroup)} .d .t-obj{fill:var(--object)}
    .d .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.3}
    .d .t-warn{fill:var(--warn)}
  </style>

        <text x="30" y="28" class="mut t-s">lane</text>
        <text x="200" y="28" class="mut t-s">time →</text>

        <line x1="250" y1="40" x2="250" y2="248" class="ln-d"/>
        <line x1="430" y1="40" x2="430" y2="248" class="ln-d"/>
        <line x1="780" y1="40" x2="780" y2="248" class="ln-d"/>

        <text x="30" y="72" class="lbl t-s">publisher · control</text>
        <rect x="200" y="56" width="660" height="26" rx="2" class="box" opacity="0.35"/>
        <rect x="250" y="56" width="52" height="26" rx="2" class="acc"/>
        <rect x="780" y="56" width="42" height="26" rx="2" class="acc"/>

        <text x="30" y="116" class="lbl t-s">publisher · data</text>
        <rect x="200" y="100" width="660" height="26" rx="2" class="box" opacity="0.35"/>
        <rect x="430" y="100" width="372" height="26" rx="2" class="b-sub"/>

        <text x="30" y="170" class="lbl t-s">subscriber · control</text>
        <rect x="200" y="154" width="660" height="26" rx="2" class="box" opacity="0.35"/>
        <rect x="430" y="154" width="58" height="26" rx="2" class="acc"/>
        <rect x="762" y="154" width="34" height="26" rx="2" class="acc"/>

        <text x="30" y="214" class="lbl t-s">subscriber · data</text>
        <rect x="200" y="198" width="660" height="26" rx="2" class="box" opacity="0.35"/>
        <rect x="466" y="198" width="316" height="26" rx="2" class="b-sub"/>

        <line x1="200" y1="248" x2="860" y2="248" class="ln"/>
        <text x="202" y="266" class="mut t-s">1 · relay listens</text>
        <text x="252" y="284" class="mut t-s">2 · publisher declares</text>
        <text x="432" y="266" class="mut t-s">3 · subscriber subscribes</text>
        <text x="782" y="284" class="mut t-s">4 · termination</text>

        <text x="30" y="316" class="lbl t-s">Control activity concentrates in two separated intervals. The publisher data lane starts after the subscriber requests a track.</text>
        <text x="30" y="332" class="mut t-s">The relay withdraws the namespace registration when the publisher session ends.</text>
      </svg>
