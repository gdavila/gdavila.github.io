<svg xmlns="http://www.w3.org/2000/svg" class="d" viewBox="0 0 900 330" role="img" aria-label="Inside one QUIC connection the control channel spans the figure and stays open while three data streams run; one data stream is interrupted and marked abandoned, and an abandonment signal reaches the subscriber while the session stays established">
  <style>
    svg.d{
      --surface:#FFFFFF; --surface-2:#F5F8F7;
      --ink:#141C1B; --ink-2:#485654; --ink-3:#6F7D7B;
      --paper:#EEF1F0; --rule:#D2DAD8;
      --accent:#0B6B63; --accent-bg:#DBEDEA;
      --track:#3B4EC0;   --track-bg:#E4E8FA;
      --group:#0F7A83;   --group-bg:#DBEFF1;
      --subgroup:#A65E00;--subgroup-bg:#F7EBD7;
      --object:#A0335E;  --object-bg:#F8E4EC;
      --warn:#A3441B;    --warn-bg:#F9E7DE;
      color:var(--ink);
    }
    @media (prefers-color-scheme: dark){
      svg.d{
        --surface:#151E1C; --surface-2:#1A2422;
        --ink:#E7EDEB; --ink-2:#A9B7B4; --ink-3:#81908D;
        --paper:#0E1413; --rule:#2B3735;
        --accent:#4FC7B8; --accent-bg:#11302C;
        --track:#93A2F7;   --track-bg:#232B52;
        --group:#54C3CE;   --group-bg:#123034;
        --subgroup:#E0A354;--subgroup-bg:#37270F;
        --object:#EE85AA;  --object-bg:#3A1A26;
        --warn:#E39067;    --warn-bg:#3A2117;
      }
    }
    .d text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px;fill:currentColor}
    .d .t-s{font-size:10.5px}
    .d .t-b{font-weight:600}
    .d .mut{fill:var(--ink-3)}
    .d .lbl{fill:var(--ink-2)}
    .d .box{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.25}
    .d .box-p{fill:var(--paper);stroke:var(--rule);stroke-width:1.25}
    .d .ln{stroke:var(--rule);stroke-width:1.25;fill:none}
    .d .ln-d{stroke:var(--rule);stroke-width:1.25;fill:none;stroke-dasharray:4 4}
    .d .flow{stroke:var(--ink-2);stroke-width:1.4;fill:none}
    .d .flow-hv{stroke:var(--ink-2);stroke-width:3;fill:none}
    .d .flow-a{stroke:var(--accent);stroke-width:1.6;fill:none}
    .d .flow-w{stroke:var(--warn);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .d .acc{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.4}
    .d .acc-t{fill:var(--accent)}
    .d .b-track{fill:var(--track-bg);stroke:var(--track);stroke-width:1.3}
    .d .b-group{fill:var(--group-bg);stroke:var(--group);stroke-width:1.3}
    .d .b-sub{fill:var(--subgroup-bg);stroke:var(--subgroup);stroke-width:1.3}
    .d .b-obj{fill:var(--object-bg);stroke:var(--object);stroke-width:1.3}
    .d .t-track{fill:var(--track)} .d .t-group{fill:var(--group)}
    .d .t-sub{fill:var(--subgroup)} .d .t-obj{fill:var(--object)}
    .d .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.3}
    .d .t-warn{fill:var(--warn)}
  </style>

        <defs><marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)"/></marker></defs>

        <rect x="30" y="20" width="840" height="252" rx="6" class="box-p"/>
        <text x="46" y="44" class="t-b">one QUIC connection</text>

        <rect x="756" y="58" width="100" height="196" rx="3" class="box"/>
        <text x="806" y="150" text-anchor="middle" class="t-s">subscriber</text>
        <text x="806" y="166" text-anchor="middle" class="t-s mut">far end</text>

        <rect x="46" y="58" width="696" height="42" rx="3" class="acc"/>
        <text x="60" y="76" class="acc-t t-b">control channel</text>
        <text x="60" y="92" class="acc-t t-s">open for the lifetime of the session</text>
        <text x="730" y="85" text-anchor="end" class="acc-t t-s">flow control credit allocated first</text>

        <rect x="46" y="112" width="696" height="34" rx="3" class="b-sub"/>
        <text x="60" y="134" class="t-sub t-s">data stream · one subgroup</text>
        <text x="730" y="134" text-anchor="end" class="t-sub t-s">complete</text>

        <rect x="46" y="156" width="380" height="34" rx="3" class="b-sub" opacity="0.65"/>
        <text x="60" y="178" class="t-sub t-s">data stream · one subgroup</text>
        <line x1="428" y1="152" x2="428" y2="194" class="ln" stroke="var(--warn)" stroke-width="2"/>
        <text x="440" y="178" class="t-warn t-s">abandoned</text>
        <line x1="530" y1="173" x2="748" y2="173" class="flow-w" marker-end="url(#a12)"/>
        <text x="639" y="166" text-anchor="middle" class="t-warn t-s">abandonment signal</text>

        <rect x="46" y="200" width="696" height="34" rx="3" class="b-sub"/>
        <text x="60" y="222" class="t-sub t-s">data stream · one subgroup</text>
        <text x="730" y="222" text-anchor="end" class="t-sub t-s">complete</text>

        <text x="46" y="260" class="lbl t-s">session: established · subscriptions: active · control channel: open</text>
        <text x="30" y="300" class="lbl t-s">One stream stops early; whether other media remains decodable depends on packaging.</text>
        <text x="30" y="318" class="mut t-s">A data-stream reset does not by itself cancel the subscription.</text>
      </svg>
