<svg xmlns="http://www.w3.org/2000/svg" class="d" viewBox="0 0 900 590" role="img" aria-label="Three lifelines show two MOQT sessions, a publication of namespace /bbb, and two subscriptions for the same Full Track Name /bbb plus 0.mp4">
  <style>
    svg.d{
      --surface:#FFFFFF; --surface-2:#F5F8F7;
      --ink:#141C1B; --ink-2:#485654; --ink-3:#6F7D7B;
      --paper:#EEF1F0; --rule:#D2DAD8;
      --accent:#0B6B63; --accent-bg:#DBEDEA;
      --track:#3B4EC0;   --track-bg:#E4E8FA;
      --group:#0F7A83;   --group-bg:#DBEFF1;
      --subgroup:#A65E00;--subgroup-bg:#F7EBD7;
      --object:#A0335E;  --object-bg:#F8E4EC;
      --warn:#A3441B;    --warn-bg:#F9E7DE;
      color:var(--ink);
    }
    @media (prefers-color-scheme: dark){
      svg.d{
        --surface:#151E1C; --surface-2:#1A2422;
        --ink:#E7EDEB; --ink-2:#A9B7B4; --ink-3:#81908D;
        --paper:#0E1413; --rule:#2B3735;
        --accent:#4FC7B8; --accent-bg:#11302C;
        --track:#93A2F7;   --track-bg:#232B52;
        --group:#54C3CE;   --group-bg:#123034;
        --subgroup:#E0A354;--subgroup-bg:#37270F;
        --object:#EE85AA;  --object-bg:#3A1A26;
        --warn:#E39067;    --warn-bg:#3A2117;
      }
    }
    .d text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px;fill:currentColor}
    .d .t-s{font-size:10.5px}
    .d .t-b{font-weight:600}
    .d .mut{fill:var(--ink-3)}
    .d .lbl{fill:var(--ink-2)}
    .d .box{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.25}
    .d .box-p{fill:var(--paper);stroke:var(--rule);stroke-width:1.25}
    .d .ln{stroke:var(--rule);stroke-width:1.25;fill:none}
    .d .ln-d{stroke:var(--rule);stroke-width:1.25;fill:none;stroke-dasharray:4 4}
    .d .flow{stroke:var(--ink-2);stroke-width:1.4;fill:none}
    .d .flow-hv{stroke:var(--ink-2);stroke-width:3;fill:none}
    .d .flow-a{stroke:var(--accent);stroke-width:1.6;fill:none}
    .d .flow-w{stroke:var(--warn);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .d .acc{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.4}
    .d .acc-t{fill:var(--accent)}
    .d .b-track{fill:var(--track-bg);stroke:var(--track);stroke-width:1.3}
    .d .b-group{fill:var(--group-bg);stroke:var(--group);stroke-width:1.3}
    .d .b-sub{fill:var(--subgroup-bg);stroke:var(--subgroup);stroke-width:1.3}
    .d .b-obj{fill:var(--object-bg);stroke:var(--object);stroke-width:1.3}
    .d .t-track{fill:var(--track)} .d .t-group{fill:var(--group)}
    .d .t-sub{fill:var(--subgroup)} .d .t-obj{fill:var(--object)}
    .d .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.3}
    .d .t-warn{fill:var(--warn)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>

  <text x="145" y="28" text-anchor="middle" class="t-b">publisher</text><text x="450" y="28" text-anchor="middle" class="acc-t t-b">relay</text><text x="755" y="28" text-anchor="middle" class="t-b">subscriber</text>
  <path d="M145 44 V548 M450 44 V548 M755 44 V548" class="ln-d"/>
  <path d="M145 67 H443" class="flow" marker-end="url(#arrow)"/><text x="297" y="58" text-anchor="middle" class="t-s">QUIC + WebTransport session</text>
  <path d="M145 112 H443" class="flow-a" marker-end="url(#arrow-a)"/><text x="297" y="103" text-anchor="middle" class="acc-t t-s">MOQT CLIENT_SETUP</text>
  <path d="M450 143 H152" class="flow-a" marker-end="url(#arrow-a)"/><text x="297" y="134" text-anchor="middle" class="acc-t t-s">MOQT SERVER_SETUP</text>
  <path d="M145 188 H443" class="flow-a" marker-end="url(#arrow-a)"/><text x="297" y="179" text-anchor="middle" class="acc-t t-s">PUBLISH_NAMESPACE · /bbb</text>
  <path d="M450 219 H152" class="flow-a" marker-end="url(#arrow-a)"/><text x="297" y="210" text-anchor="middle" class="acc-t t-s">request confirmed</text>
  <path d="M755 266 H457" class="flow" marker-end="url(#arrow)"/><text x="602" y="257" text-anchor="middle" class="t-s">separate QUIC + WebTransport</text>
  <path d="M755 311 H457" class="flow-a" marker-end="url(#arrow-a)"/><text x="602" y="302" text-anchor="middle" class="acc-t t-s">MOQT CLIENT_SETUP</text>
  <path d="M450 342 H748" class="flow-a" marker-end="url(#arrow-a)"/><text x="602" y="333" text-anchor="middle" class="acc-t t-s">MOQT SERVER_SETUP</text>
  <path d="M755 389 H457" class="flow-a" marker-end="url(#arrow-a)"/><text x="602" y="380" text-anchor="middle" class="acc-t t-s">SUBSCRIBE · (/bbb, 0.mp4)</text>
  <path d="M450 428 H152" class="flow-a" marker-end="url(#arrow-a)"/><text x="297" y="419" text-anchor="middle" class="acc-t t-s">SUBSCRIBE · (/bbb, 0.mp4)</text>
  <path d="M145 467 H443" class="flow-a" marker-end="url(#arrow-a)"/><text x="297" y="458" text-anchor="middle" class="acc-t t-s">upstream confirmation</text>
  <path d="M450 506 H748" class="flow-a" marker-end="url(#arrow-a)"/><text x="602" y="497" text-anchor="middle" class="acc-t t-s">downstream confirmation</text>
  <text x="450" y="570" text-anchor="middle" class="mut t-s">Time runs downward. Both sessions request the same Full Track Name with separate IDs.</text>
</svg>
