<svg xmlns="http://www.w3.org/2000/svg" class="d" viewBox="0 0 900 215" width="900" height="215" role="img" aria-label="Publisher and subscriber each initiate a session toward the relay on solid lines; objects flow publisher to relay to subscriber on dashed lines">
  <style>
    svg.d{
      --surface:#FFFFFF; --surface-2:#F5F8F7;
      --ink:#141C1B; --ink-2:#485654; --ink-3:#6F7D7B;
      --paper:#EEF1F0; --rule:#D2DAD8;
      --accent:#0B6B63; --accent-bg:#DBEDEA;
      --track:#3B4EC0;   --track-bg:#E4E8FA;
      --group:#0F7A83;   --group-bg:#DBEFF1;
      --subgroup:#A65E00;--subgroup-bg:#F7EBD7;
      --object:#A0335E;  --object-bg:#F8E4EC;
      --warn:#A3441B;    --warn-bg:#F9E7DE;
      color:var(--ink);
    }
    @media (prefers-color-scheme: dark){
      svg.d{
        --surface:#151E1C; --surface-2:#1A2422;
        --ink:#E7EDEB; --ink-2:#A9B7B4; --ink-3:#81908D;
        --paper:#0E1413; --rule:#2B3735;
        --accent:#4FC7B8; --accent-bg:#11302C;
        --track:#93A2F7;   --track-bg:#232B52;
        --group:#54C3CE;   --group-bg:#123034;
        --subgroup:#E0A354;--subgroup-bg:#37270F;
        --object:#EE85AA;  --object-bg:#3A1A26;
        --warn:#E39067;    --warn-bg:#3A2117;
      }
    }
    .d text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px;fill:currentColor}
    .d .t-s{font-size:10.5px}
    .d .t-b{font-weight:600}
    .d .mut{fill:var(--ink-3)}
    .d .lbl{fill:var(--ink-2)}
    .d .box{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.25}
    .d .box-p{fill:var(--paper);stroke:var(--rule);stroke-width:1.25}
    .d .ln{stroke:var(--rule);stroke-width:1.25;fill:none}
    .d .ln-d{stroke:var(--rule);stroke-width:1.25;fill:none;stroke-dasharray:4 4}
    .d .flow{stroke:var(--ink-2);stroke-width:1.4;fill:none}
    .d .flow-hv{stroke:var(--ink-2);stroke-width:3;fill:none}
    .d .flow-a{stroke:var(--accent);stroke-width:1.6;fill:none}
    .d .flow-w{stroke:var(--warn);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .d .acc{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.4}
    .d .acc-t{fill:var(--accent)}
    .d .b-track{fill:var(--track-bg);stroke:var(--track);stroke-width:1.3}
    .d .b-group{fill:var(--group-bg);stroke:var(--group);stroke-width:1.3}
    .d .b-sub{fill:var(--subgroup-bg);stroke:var(--subgroup);stroke-width:1.3}
    .d .b-obj{fill:var(--object-bg);stroke:var(--object);stroke-width:1.3}
    .d .t-track{fill:var(--track)} .d .t-group{fill:var(--group)}
    .d .t-sub{fill:var(--subgroup)} .d .t-obj{fill:var(--object)}
    .d .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.3}
    .d .t-warn{fill:var(--warn)}
  </style>

  <text x="450" y="27" text-anchor="middle" class="t-b">One relay, two separate sessions</text>
  <line x1="240" y1="48" x2="285" y2="48" stroke="var(--ink-2)" stroke-width="1.6"/>
  <polygon points="285,48 277,44 277,52" fill="var(--ink-2)"/>
  <text x="297" y="52" class="lbl t-s">session initiation</text>
  <line x1="500" y1="48" x2="508" y2="48" stroke="var(--accent)" stroke-width="2"/>
  <line x1="515" y1="48" x2="523" y2="48" stroke="var(--accent)" stroke-width="2"/>
  <line x1="530" y1="48" x2="537" y2="48" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="545,48 537,44 537,52" fill="var(--accent)"/>
  <text x="557" y="52" class="acc-t t-s">object delivery</text>
  <rect x="60" y="91" width="170" height="70" rx="3" class="box"/>
  <text x="145" y="119" text-anchor="middle" class="t-b">publisher</text>
  <text x="145" y="139" text-anchor="middle" class="t-s mut">client</text>
  <rect x="365" y="91" width="170" height="70" rx="3" class="acc"/>
  <text x="450" y="119" text-anchor="middle" class="acc-t t-b">relay</text>
  <text x="450" y="139" text-anchor="middle" class="acc-t t-s">server to both</text>
  <rect x="670" y="91" width="170" height="70" rx="3" class="box"/>
  <text x="755" y="119" text-anchor="middle" class="t-b">subscriber</text>
  <text x="755" y="139" text-anchor="middle" class="t-s mut">client</text>
  <line x1="234" y1="108" x2="361" y2="108" stroke="var(--ink-2)" stroke-width="1.6"/>
  <line x1="666" y1="108" x2="539" y2="108" stroke="var(--ink-2)" stroke-width="1.6"/>
  <line x1="234" y1="145" x2="244" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="252" y1="145" x2="262" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="270" y1="145" x2="280" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="288" y1="145" x2="298" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="306" y1="145" x2="316" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="324" y1="145" x2="334" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="342" y1="145" x2="353" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="539" y1="145" x2="550" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="558" y1="145" x2="568" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="576" y1="145" x2="586" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="594" y1="145" x2="604" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="612" y1="145" x2="622" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="630" y1="145" x2="640" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <line x1="648" y1="145" x2="658" y2="145" stroke="var(--accent)" stroke-width="2"/>
  <polygon points="361,108 353,104 353,112" fill="var(--ink-2)"/>
  <polygon points="539,108 547,104 547,112" fill="var(--ink-2)"/>
  <polygon points="361,145 353,141 353,149" fill="var(--accent)"/>
  <polygon points="666,145 658,141 658,149" fill="var(--accent)"/>
  <text x="450" y="198" text-anchor="middle" class="mut t-s">Objects: publisher → relay → subscriber</text>
</svg>
