<svg xmlns="http://www.w3.org/2000/svg" class="d" viewBox="0 0 900 340" role="img" aria-label="One group whose objects are assigned to two subgroups, each subgroup carried on its own stream; one stream completes and the other is abandoned, removing the set of objects assigned to it">
  <style>
    svg.d{
      --surface:#FFFFFF; --surface-2:#F5F8F7;
      --ink:#141C1B; --ink-2:#485654; --ink-3:#6F7D7B;
      --paper:#EEF1F0; --rule:#D2DAD8;
      --accent:#0B6B63; --accent-bg:#DBEDEA;
      --track:#3B4EC0;   --track-bg:#E4E8FA;
      --group:#0F7A83;   --group-bg:#DBEFF1;
      --subgroup:#A65E00;--subgroup-bg:#F7EBD7;
      --object:#A0335E;  --object-bg:#F8E4EC;
      --warn:#A3441B;    --warn-bg:#F9E7DE;
      color:var(--ink);
    }
    @media (prefers-color-scheme: dark){
      svg.d{
        --surface:#151E1C; --surface-2:#1A2422;
        --ink:#E7EDEB; --ink-2:#A9B7B4; --ink-3:#81908D;
        --paper:#0E1413; --rule:#2B3735;
        --accent:#4FC7B8; --accent-bg:#11302C;
        --track:#93A2F7;   --track-bg:#232B52;
        --group:#54C3CE;   --group-bg:#123034;
        --subgroup:#E0A354;--subgroup-bg:#37270F;
        --object:#EE85AA;  --object-bg:#3A1A26;
        --warn:#E39067;    --warn-bg:#3A2117;
      }
    }
    .d text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px;fill:currentColor}
    .d .t-s{font-size:10.5px}
    .d .t-b{font-weight:600}
    .d .mut{fill:var(--ink-3)}
    .d .lbl{fill:var(--ink-2)}
    .d .box{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.25}
    .d .box-p{fill:var(--paper);stroke:var(--rule);stroke-width:1.25}
    .d .ln{stroke:var(--rule);stroke-width:1.25;fill:none}
    .d .ln-d{stroke:var(--rule);stroke-width:1.25;fill:none;stroke-dasharray:4 4}
    .d .flow{stroke:var(--ink-2);stroke-width:1.4;fill:none}
    .d .flow-hv{stroke:var(--ink-2);stroke-width:3;fill:none}
    .d .flow-a{stroke:var(--accent);stroke-width:1.6;fill:none}
    .d .flow-w{stroke:var(--warn);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .d .acc{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.4}
    .d .acc-t{fill:var(--accent)}
    .d .b-track{fill:var(--track-bg);stroke:var(--track);stroke-width:1.3}
    .d .b-group{fill:var(--group-bg);stroke:var(--group);stroke-width:1.3}
    .d .b-sub{fill:var(--subgroup-bg);stroke:var(--subgroup);stroke-width:1.3}
    .d .b-obj{fill:var(--object-bg);stroke:var(--object);stroke-width:1.3}
    .d .t-track{fill:var(--track)} .d .t-group{fill:var(--group)}
    .d .t-sub{fill:var(--subgroup)} .d .t-obj{fill:var(--object)}
    .d .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.3}
    .d .t-warn{fill:var(--warn)}
  </style>

        <defs><marker id="a16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker></defs>

        <rect x="40" y="34" width="820" height="76" rx="4" class="b-group"/>
        <text x="54" y="54" class="t-group t-b">GROUP</text>
        <text x="120" y="54" class="t-group t-s">intended as a join point</text>
        <g>
          <rect x="70" y="62" width="82" height="36" rx="2" class="b-obj"/>
          <text x="111" y="85" text-anchor="middle" class="t-obj t-s">obj 0</text>
          <rect x="166" y="62" width="82" height="36" rx="2" class="b-obj" opacity="0.6"/>
          <text x="207" y="85" text-anchor="middle" class="t-obj t-s">obj 1</text>
          <rect x="262" y="62" width="82" height="36" rx="2" class="b-obj"/>
          <text x="303" y="85" text-anchor="middle" class="t-obj t-s">obj 2</text>
          <rect x="358" y="62" width="82" height="36" rx="2" class="b-obj" opacity="0.6"/>
          <text x="399" y="85" text-anchor="middle" class="t-obj t-s">obj 3</text>
          <rect x="454" y="62" width="82" height="36" rx="2" class="b-obj"/>
          <text x="495" y="85" text-anchor="middle" class="t-obj t-s">obj 4</text>
          <rect x="550" y="62" width="82" height="36" rx="2" class="b-obj" opacity="0.6"/>
          <text x="591" y="85" text-anchor="middle" class="t-obj t-s">obj 5</text>
          <rect x="646" y="62" width="82" height="36" rx="2" class="b-obj"/>
          <text x="687" y="85" text-anchor="middle" class="t-obj t-s">obj 6</text>
          <rect x="742" y="62" width="82" height="36" rx="2" class="b-obj" opacity="0.6"/>
          <text x="783" y="85" text-anchor="middle" class="t-obj t-s">obj 7</text>
        </g>

        <line x1="240" y1="110" x2="240" y2="156" class="flow" marker-end="url(#a16)"/>
        <line x1="660" y1="110" x2="660" y2="156" class="flow" marker-end="url(#a16)"/>
        <text x="450" y="136" text-anchor="middle" class="mut t-s">assignment during packaging</text>

        <rect x="40" y="160" width="400" height="44" rx="3" class="b-sub"/>
        <text x="54" y="180" class="t-sub t-b">SUBGROUP 0</text>
        <text x="54" y="196" class="t-sub t-s">objects 0, 2, 4, 6</text>
        <rect x="460" y="160" width="400" height="44" rx="3" class="b-sub" opacity="0.6"/>
        <text x="474" y="180" class="t-sub t-b">SUBGROUP 1</text>
        <text x="474" y="196" class="t-sub t-s">objects 1, 3, 5, 7</text>

        <line x1="240" y1="204" x2="240" y2="240" class="flow" marker-end="url(#a16)"/>
        <line x1="660" y1="204" x2="660" y2="240" class="flow" marker-end="url(#a16)"/>

        <rect x="40" y="244" width="400" height="44" rx="3" class="box"/>
        <text x="54" y="264" class="t-b">stream</text>
        <text x="54" y="280" class="t-s mut">complete</text>
        <rect x="460" y="244" width="400" height="44" rx="3" class="warn"/>
        <text x="474" y="264" class="t-warn t-b">stream</text>
        <text x="474" y="280" class="t-warn t-s">interrupted — some objects may not arrive</text>

        <text x="40" y="318" class="lbl t-s">A subgroup is carried on a single stream whenever possible; a group uses at least as many streams as it has subgroups.</text>
        <text x="40" y="334" class="mut t-s">Packaging determines which dependencies share a stream.</text>
      </svg>
