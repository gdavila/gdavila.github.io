<svg xmlns="http://www.w3.org/2000/svg" class="d" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="An illustrative named video track has successive groups; one group contains five objects, four delivered in two subgroups on separate streams and one delivered as a datagram">
  <style>
    svg.d{
      --surface:#FFFFFF; --surface-2:#F5F8F7;
      --ink:#141C1B; --ink-2:#485654; --ink-3:#6F7D7B;
      --paper:#EEF1F0; --rule:#D2DAD8;
      --accent:#0B6B63; --accent-bg:#DBEDEA;
      --track:#3B4EC0;   --track-bg:#E4E8FA;
      --group:#0F7A83;   --group-bg:#DBEFF1;
      --subgroup:#A65E00;--subgroup-bg:#F7EBD7;
      --object:#A0335E;  --object-bg:#F8E4EC;
      --warn:#A3441B;    --warn-bg:#F9E7DE;
      color:var(--ink);
    }
    @media (prefers-color-scheme: dark){
      svg.d{
        --surface:#151E1C; --surface-2:#1A2422;
        --ink:#E7EDEB; --ink-2:#A9B7B4; --ink-3:#81908D;
        --paper:#0E1413; --rule:#2B3735;
        --accent:#4FC7B8; --accent-bg:#11302C;
        --track:#93A2F7;   --track-bg:#232B52;
        --group:#54C3CE;   --group-bg:#123034;
        --subgroup:#E0A354;--subgroup-bg:#37270F;
        --object:#EE85AA;  --object-bg:#3A1A26;
        --warn:#E39067;    --warn-bg:#3A2117;
      }
    }
    .d text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px;fill:currentColor}
    .d .t-s{font-size:10.5px}
    .d .t-b{font-weight:600}
    .d .mut{fill:var(--ink-3)}
    .d .lbl{fill:var(--ink-2)}
    .d .box{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.25}
    .d .box-p{fill:var(--paper);stroke:var(--rule);stroke-width:1.25}
    .d .ln{stroke:var(--rule);stroke-width:1.25;fill:none}
    .d .ln-d{stroke:var(--rule);stroke-width:1.25;fill:none;stroke-dasharray:4 4}
    .d .flow{stroke:var(--ink-2);stroke-width:1.4;fill:none}
    .d .flow-hv{stroke:var(--ink-2);stroke-width:3;fill:none}
    .d .flow-a{stroke:var(--accent);stroke-width:1.6;fill:none}
    .d .flow-w{stroke:var(--warn);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .d .acc{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.4}
    .d .acc-t{fill:var(--accent)}
    .d .b-track{fill:var(--track-bg);stroke:var(--track);stroke-width:1.3}
    .d .b-group{fill:var(--group-bg);stroke:var(--group);stroke-width:1.3}
    .d .b-sub{fill:var(--subgroup-bg);stroke:var(--subgroup);stroke-width:1.3}
    .d .b-obj{fill:var(--object-bg);stroke:var(--object);stroke-width:1.3}
    .d .t-track{fill:var(--track)} .d .t-group{fill:var(--group)}
    .d .t-sub{fill:var(--subgroup)} .d .t-obj{fill:var(--object)}
    .d .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.3}
    .d .t-warn{fill:var(--warn)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker><marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>

  <text x="28" y="28" class="t-b">A named track, successive groups, several object paths</text>
  <text x="28" y="48" class="mut t-s">The object mapping below is an example, not a MOQT packaging rule.</text>
  <rect x="25" y="62" width="850" height="315" rx="5" class="b-track"/>
  <text x="43" y="86" class="t-track t-b">TRACK — the subscription target</text>
  <text x="43" y="106" class="t-track t-s">Namespace ("example", "live") + Track Name "video" = Full Track Name</text>

  <rect x="42" y="129" width="610" height="228" rx="4" class="b-group"/>
  <text x="60" y="153" class="t-group t-b">GROUP 42</text>
  <text x="160" y="153" class="t-group t-s">possible join point</text>
  <text x="60" y="178" class="mut t-s">Five addressable objects in this illustrative group:</text>
  <rect x="61" y="188" width="92" height="42" rx="3" class="b-obj"/><text x="107" y="205" text-anchor="middle" class="t-obj t-b t-s">Object 0</text><text x="107" y="221" text-anchor="middle" class="t-obj t-s">base</text>
  <rect x="170" y="188" width="92" height="42" rx="3" class="b-obj"/><text x="216" y="205" text-anchor="middle" class="t-obj t-b t-s">Object 1</text><text x="216" y="221" text-anchor="middle" class="t-obj t-s">enhance</text>
  <rect x="279" y="188" width="92" height="42" rx="3" class="b-obj"/><text x="325" y="205" text-anchor="middle" class="t-obj t-b t-s">Object 2</text><text x="325" y="221" text-anchor="middle" class="t-obj t-s">base</text>
  <rect x="388" y="188" width="92" height="42" rx="3" class="b-obj"/><text x="434" y="205" text-anchor="middle" class="t-obj t-b t-s">Object 3</text><text x="434" y="221" text-anchor="middle" class="t-obj t-s">enhance</text>
  <rect x="497" y="188" width="92" height="42" rx="3" class="b-obj"/><text x="543" y="205" text-anchor="middle" class="t-obj t-b t-s">Object 4</text><text x="543" y="221" text-anchor="middle" class="t-obj t-s">ephemeral</text>
  <text x="60" y="248" class="mut t-s">Delivery choice for these objects:</text>
  <rect x="60" y="258" width="255" height="39" rx="3" class="b-sub"/><text x="72" y="275" class="t-sub t-b t-s">SUBGROUP 0</text><text x="72" y="290" class="t-sub t-s">Objects 0, 2 → stream A</text>
  <rect x="326" y="258" width="307" height="39" rx="3" class="b-sub"/><text x="338" y="275" class="t-sub t-b t-s">SUBGROUP 1</text><text x="338" y="290" class="t-sub t-s">Objects 1, 3 → stream B</text>
  <rect x="60" y="307" width="573" height="35" rx="3" class="box-p"/><text x="72" y="329" class="t-s">Object 4 → datagram; it belongs to neither subgroup</text>

  <rect x="667" y="129" width="190" height="228" rx="4" class="b-group"/>
  <text x="684" y="153" class="t-group t-b">GROUP 43</text>
  <text x="684" y="179" class="t-group t-s">Next group in the</text>
  <text x="684" y="196" class="t-group t-s">same track.</text>
  <text x="684" y="234" class="mut t-s">Its objects and</text>
  <text x="684" y="251" class="mut t-s">delivery choices</text>
  <text x="684" y="268" class="mut t-s">are independent</text>
  <text x="684" y="285" class="mut t-s">of Group 42.</text>

  <path d="M28 394 H872" class="ln"/>
  <text x="28" y="411" class="t-b t-s">The track is subscribed to; the group and object identify delivered content.</text>
  <text x="28" y="425" class="mut t-s">Subgroup streams group related objects; a datagram object bypasses subgroups.</text>
</svg>
