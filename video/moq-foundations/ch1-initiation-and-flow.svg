<svg xmlns="http://www.w3.org/2000/svg" class="d" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Two stacked rows over the same three elements: in the first, both session initiation arrows converge on the relay; in the second, media flow traverses publisher to relay to subscriber">
  <style>
    svg.d{
      --surface:#FFFFFF; --surface-2:#F5F8F7;
      --ink:#141C1B; --ink-2:#485654; --ink-3:#6F7D7B;
      --paper:#EEF1F0; --rule:#D2DAD8;
      --accent:#0B6B63; --accent-bg:#DBEDEA;
      --track:#3B4EC0;   --track-bg:#E4E8FA;
      --group:#0F7A83;   --group-bg:#DBEFF1;
      --subgroup:#A65E00;--subgroup-bg:#F7EBD7;
      --object:#A0335E;  --object-bg:#F8E4EC;
      --warn:#A3441B;    --warn-bg:#F9E7DE;
      color:var(--ink);
    }
    @media (prefers-color-scheme: dark){
      svg.d{
        --surface:#151E1C; --surface-2:#1A2422;
        --ink:#E7EDEB; --ink-2:#A9B7B4; --ink-3:#81908D;
        --paper:#0E1413; --rule:#2B3735;
        --accent:#4FC7B8; --accent-bg:#11302C;
        --track:#93A2F7;   --track-bg:#232B52;
        --group:#54C3CE;   --group-bg:#123034;
        --subgroup:#E0A354;--subgroup-bg:#37270F;
        --object:#EE85AA;  --object-bg:#3A1A26;
        --warn:#E39067;    --warn-bg:#3A2117;
      }
    }
    .d text{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
            font-size:12px;fill:currentColor}
    .d .t-s{font-size:10.5px}
    .d .t-b{font-weight:600}
    .d .mut{fill:var(--ink-3)}
    .d .lbl{fill:var(--ink-2)}
    .d .box{fill:var(--surface-2);stroke:var(--rule);stroke-width:1.25}
    .d .box-p{fill:var(--paper);stroke:var(--rule);stroke-width:1.25}
    .d .ln{stroke:var(--rule);stroke-width:1.25;fill:none}
    .d .ln-d{stroke:var(--rule);stroke-width:1.25;fill:none;stroke-dasharray:4 4}
    .d .flow{stroke:var(--ink-2);stroke-width:1.4;fill:none}
    .d .flow-hv{stroke:var(--ink-2);stroke-width:3;fill:none}
    .d .flow-a{stroke:var(--accent);stroke-width:1.6;fill:none}
    .d .flow-w{stroke:var(--warn);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
    .d .acc{fill:var(--accent-bg);stroke:var(--accent);stroke-width:1.4}
    .d .acc-t{fill:var(--accent)}
    .d .b-track{fill:var(--track-bg);stroke:var(--track);stroke-width:1.3}
    .d .b-group{fill:var(--group-bg);stroke:var(--group);stroke-width:1.3}
    .d .b-sub{fill:var(--subgroup-bg);stroke:var(--subgroup);stroke-width:1.3}
    .d .b-obj{fill:var(--object-bg);stroke:var(--object);stroke-width:1.3}
    .d .t-track{fill:var(--track)} .d .t-group{fill:var(--group)}
    .d .t-sub{fill:var(--subgroup)} .d .t-obj{fill:var(--object)}
    .d .warn{fill:var(--warn-bg);stroke:var(--warn);stroke-width:1.3}
    .d .t-warn{fill:var(--warn)}
  </style>

        <defs><marker id="a14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink-2)"/></marker>
        <marker id="a14a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>

        <text x="150" y="42" class="t-b">session initiation</text>
        <text x="330" y="42" class="mut t-s">both arrows converge on the relay</text>
        <rect x="150" y="56" width="150" height="54" rx="3" class="box"/>
        <text x="225" y="88" text-anchor="middle">publisher</text>
        <rect x="380" y="56" width="150" height="54" rx="3" class="acc"/>
        <text x="455" y="88" text-anchor="middle" class="acc-t">relay</text>
        <rect x="610" y="56" width="150" height="54" rx="3" class="box"/>
        <text x="685" y="88" text-anchor="middle">subscriber</text>
        <line x1="304" y1="83" x2="376" y2="83" class="flow-hv" marker-end="url(#a14)"/>
        <line x1="606" y1="83" x2="534" y2="83" class="flow-hv" marker-end="url(#a14)"/>

        <text x="150" y="192" class="t-b">media flow</text>
        <text x="270" y="192" class="mut t-s">traverses the relay in one direction</text>
        <rect x="150" y="206" width="150" height="54" rx="3" class="box"/>
        <text x="225" y="238" text-anchor="middle">publisher</text>
        <rect x="380" y="206" width="150" height="54" rx="3" class="acc"/>
        <text x="455" y="238" text-anchor="middle" class="acc-t">relay</text>
        <rect x="610" y="206" width="150" height="54" rx="3" class="box"/>
        <text x="685" y="238" text-anchor="middle">subscriber</text>
        <line x1="304" y1="233" x2="376" y2="233" class="flow-a" marker-end="url(#a14a)"/>
        <line x1="534" y1="233" x2="606" y2="233" class="flow-a" marker-end="url(#a14a)"/>

        <text x="30" y="290" class="lbl t-s">The reachability requirement falls on the relay alone. Endpoints operate from arbitrary addresses.</text>
      </svg>
