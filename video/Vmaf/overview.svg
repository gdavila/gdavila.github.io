<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" role="img" aria-label="Overview: Reference and Distorted videos are scaled to the resolution of the VMAF model and frame-synchronized inside FFmpeg with libvmaf before VMAF computes the score">
