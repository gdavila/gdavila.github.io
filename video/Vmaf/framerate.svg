<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" role="img" aria-label="Frame rate adaptation: the reference is left unmodified; if the distorted frame rate differs from the reference, the fps filter converts it before VMAF computes the score">
  <title>Frame rate adaptation: the reference is left unmodified; if the distorted frame rate differs from the reference, the fps filter converts it before VMAF computes the score</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-weight: 600; }
    .muted { fill: #4b5563; }
    .small { font-size: 12px; }
    .bg { fill: #ffffff; stroke: #e5e7eb; }
    .io { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
    .step { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
    .vmaf { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.6; }
    .probe { fill: #dcfce7; stroke: #15803d; stroke-width: 1.4; }
    .build { fill: #fae8ff; stroke: #a21caf; stroke-width: 1.4; }
    .dec { fill: #f9fafb; stroke: #374151; stroke-width: 1.2; }
    .ff { fill: none; stroke: #d97706; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flt { fill: none; stroke: #9ca3af; stroke-width: 1.1; stroke-dasharray: 4 3; }
    .flow { fill: none; stroke: #1d4ed8; stroke-width: 1.8; }
    .note { fill: none; stroke: #6b7280; stroke-width: 1.1; stroke-dasharray: 2 3; }
    .ah { fill: #1d4ed8; }
    .ahn { fill: #6b7280; }
    .ref { fill: #dcfce7; stroke: #15803d; stroke-width: 1; }
    .dis { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1; }
    .cell { fill: #ffffff; stroke: #374151; stroke-width: 0.8; }
    .win { fill: #dbeafe; fill-opacity: 0.7; stroke: #2563eb; stroke-width: 1.6; }
    .selr { fill: none; stroke: #15803d; stroke-width: 2.2; }
    .seld { fill: none; stroke: #b91c1c; stroke-width: 2.2; }
    .zoom { fill: none; stroke: #6b7280; stroke-width: 1; stroke-dasharray: 1.5 3; }
    .tref { fill: #15803d; }
    .tdis { fill: #b91c1c; }
    .tscore { font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahn"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="759" height="265" rx="10"/>
  <rect class="ff" x="150" y="40" width="515" height="210" rx="14"/>
  <text class="b muted" x="407" y="28" text-anchor="middle">FFmpeg + libvmaf</text>
  <rect class="flt" x="178" y="100" width="322" height="136" rx="12"/>
  <text class="muted small" x="190" y="118" text-anchor="start">fps filter</text>
  <rect class="io" x="14" y="62" width="106" height="32" rx="6"/>
  <text class="b" x="67.0" y="82.5" text-anchor="middle">Reference</text>
  <rect class="io" x="14" y="156" width="106" height="32" rx="6"/>
  <text class="b" x="67.0" y="176.5" text-anchor="middle">Distorted</text>
  <path class="flow" d="M120 78 H510 V124 H528" marker-end="url(#a)"/>
  <polygon class="dec" points="262,124 310,172 262,220 214,172"/>
  <text class="b small" x="262" y="169.0" text-anchor="middle">fps_dist =</text>
  <text class="b small" x="262" y="184.0" text-anchor="middle">fps_ref ?</text>
  <path class="flow" d="M120 172 H212" marker-end="url(#a)"/>
  <rect class="step" x="346" y="156" width="136" height="32" rx="6"/>
  <text class="mono small b" x="414.0" y="176.5" text-anchor="middle">fps=fps_ref</text>
  <path class="flow" d="M310 172 H344" marker-end="url(#a)"/>
  <text class="b small" x="318" y="164" text-anchor="start">No</text>
  <path class="flow" d="M262 220 V226 H510 V188"/>
  <text class="b small" x="254" y="233" text-anchor="end">Yes</text>
  <path class="flow" d="M482 172 H510 V188 H528" marker-end="url(#a)"/>
  <rect class="vmaf" x="530" y="96" width="112" height="120" rx="6"/>
  <text class="b" x="586.0" y="160.5" text-anchor="middle">VMAF</text>
  <path class="flow" d="M642 156 H686" marker-end="url(#a)"/>
  <circle class="io" cx="716" cy="156" r="27"/>
  <text class="b tscore" x="716" y="160.5" text-anchor="middle">Score</text>

</svg>
