<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" role="img" aria-label="Scan mode normalization: an interlaced input is deinterlaced with yadif, whose first option sets whether the output keeps or doubles the input frame rate, while a progressive input goes directly to VMAF">
  <title>Scan mode normalization: an interlaced input is deinterlaced with yadif, whose first option sets whether the output keeps or doubles the input frame rate, while a progressive input goes directly to VMAF</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2937; }
    .mono { font-family: SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .b { font-weight: 600; }
    .muted { fill: #4b5563; }
    .small { font-size: 12px; }
    .bg { fill: #ffffff; stroke: #e5e7eb; }
    .io { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.2; }
    .step { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.4; }
    .vmaf { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.6; }
    .probe { fill: #dcfce7; stroke: #15803d; stroke-width: 1.4; }
    .build { fill: #fae8ff; stroke: #a21caf; stroke-width: 1.4; }
    .dec { fill: #f9fafb; stroke: #374151; stroke-width: 1.2; }
    .ff { fill: none; stroke: #d97706; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flt { fill: none; stroke: #9ca3af; stroke-width: 1.1; stroke-dasharray: 4 3; }
    .flow { fill: none; stroke: #1d4ed8; stroke-width: 1.8; }
    .note { fill: none; stroke: #6b7280; stroke-width: 1.1; stroke-dasharray: 2 3; }
    .ah { fill: #1d4ed8; }
    .ahn { fill: #6b7280; }
    .ref { fill: #dcfce7; stroke: #15803d; stroke-width: 1; }
    .dis { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1; }
    .cell { fill: #ffffff; stroke: #374151; stroke-width: 0.8; }
    .win { fill: #dbeafe; fill-opacity: 0.7; stroke: #2563eb; stroke-width: 1.6; }
    .selr { fill: none; stroke: #15803d; stroke-width: 2.2; }
    .seld { fill: none; stroke: #b91c1c; stroke-width: 2.2; }
    .zoom { fill: none; stroke: #6b7280; stroke-width: 1; stroke-dasharray: 1.5 3; }
    .tref { fill: #15803d; }
    .tdis { fill: #b91c1c; }
    .tscore { font-size: 12px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahn"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="759" height="361" rx="10"/>
  <text class="mono b" x="470" y="30" text-anchor="start" style="font-size:15px">yadif=X:-1:0</text>
  <text class="small" x="470" y="52" text-anchor="start">X depends on the frame rate we want</text>
  <text class="small" x="470" y="68" text-anchor="start">at the filter output:</text>
  <text class="small" x="470" y="88" text-anchor="start">0: same as input (29.97i → 29.97p)</text>
  <text class="small" x="470" y="106" text-anchor="start">1: doubled (29.97i → 59.94p)</text>
  <path class="note" d="M462 70 C400 80, 400 150, 398 190" marker-end="url(#an)"/>
  <rect class="ff" x="150" y="140" width="515" height="206" rx="14"/>
  <text class="b muted" x="162" y="132" text-anchor="start">FFmpeg + libvmaf</text>
  <rect class="flt" x="178" y="158" width="300" height="146" rx="12"/>
  <text class="muted small" x="190" y="176" text-anchor="start">yadif filter</text>
  <rect class="io" x="14" y="214" width="106" height="32" rx="6"/>
  <text class="b" x="67.0" y="234.5" text-anchor="middle">Reference</text>
  <rect class="io" x="14" y="304" width="106" height="32" rx="6"/>
  <text class="b" x="67.0" y="324.5" text-anchor="middle">Distorted</text>
  <polygon class="dec" points="248,210 290,252 248,294 206,252"/>
  <text class="b small" x="248" y="249.0" text-anchor="middle">scan</text>
  <text class="b small" x="248" y="264.0" text-anchor="middle">mode?</text>
  <path class="flow" d="M120 230 H160 V252 H204" marker-end="url(#a)"/>
  <rect class="step" x="338" y="192" width="124" height="32" rx="6"/>
  <text class="b" x="400.0" y="212.5" text-anchor="middle">deinterlace</text>
  <path class="flow" d="M248 210 V208 H336" marker-end="url(#a)"/>
  <text class="b small" x="258" y="200" text-anchor="start">interlaced</text>
  <path class="flow" d="M290 252 H528" marker-end="url(#a)"/>
  <text class="b small" x="304" y="244" text-anchor="start">progressive</text>
  <rect class="vmaf" x="530" y="186" width="112" height="146" rx="6"/>
  <text class="b" x="586.0" y="263.5" text-anchor="middle">VMAF</text>
  <path class="flow" d="M462 208 H528" marker-end="url(#a)"/>
  <path class="flow" d="M120 320 H528" marker-end="url(#a)"/>
  <path class="flow" d="M642 259 H686" marker-end="url(#a)"/>
  <circle class="io" cx="716" cy="259" r="27"/>
  <text class="b tscore" x="716" y="263.5" text-anchor="middle">Score</text>

</svg>
