{% assign section_posts = site.posts | sort: 'date' | reverse %}
{% for post in section_posts %}
  {% if post.categories contains include.category %}
    <section class="mb-4">
      <h2 class="h4"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <div>{{ post.excerpt | markdownify }}</div>
    </section>
  {% endif %}
{% endfor %}
