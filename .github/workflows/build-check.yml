name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build production site at the root URL
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --destination _site
      - name: Check generated site
        run: bundle exec ruby tools/check_htmlproofer.rb _site
